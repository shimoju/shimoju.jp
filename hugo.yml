baseURL: https://shimoju.jp/
locale: ja
defaultContentLanguage: ja
hasCJKLanguage: true
timeZone: Asia/Tokyo
summaryLength: 160
title: shimoju.diary
theme: shsh
mainSections:
  - posts
pagination:
  pagerSize: 10
permalinks:
  page:
    posts: /:year/:month/:day/:slugorcontentbasename/
enableRobotsTXT: true
resourceDir: .cache/hugo
imaging:
  resampleFilter: lanczos
  webp:
    hint: photo
    method: 6
    quality: 78
    useSharpYuv: true
markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
minify:
  minifyOutput: true

menus:
  main:
    - identifier: about
      name: About
      pageRef: /about
      weight: 10
    - identifier: archives
      name: Archives
      pageRef: /archives
      weight: 20
    - identifier: categories
      name: Categories
      pageRef: /categories
      weight: 30
    - identifier: tags
      name: Tags
      pageRef: /tags
      weight: 40

params:
  author:
    name: Hiroshi Shimoju
  description: ソフトウェアエンジニアshimojuの個人ブログ。Ruby on Railsを中心としたWeb開発の知見や、日々の出来事を綴ります。
  showRSS: true
  shareServices:
    - x
    - facebook
    - bluesky
    - hatena
  hatenaStar:
    enabled: true
    author: Shimoju
  socialLinks:
    - name: x
      url: https://x.com/shimoju_
    - name: bluesky
      url: https://bsky.app/profile/shimoju.jp
    - name: github
      url: https://github.com/shimoju
