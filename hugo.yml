baseURL: https://shimoju.jp/
locale: ja
defaultContentLanguage: ja
hasCJKLanguage: true
timeZone: Asia/Tokyo
summaryLength: 140
title: shimoju.diary
theme: shsh
mainSections:
  - posts
pagination:
  pagerSize: 10
permalinks:
  posts: /:year/:month/:day/:slugorcontentbasename/
enableRobotsTXT: true
imaging:
  webp:
    useSharpYuv: true
markup:
  goldmark:
    renderer:
      unsafe: false
    parser:
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false
minify:
  minifyOutput: true

menus:
  main:
    - identifier: about
      name: About
      pageRef: /about
      weight: 10
    - identifier: archives
      name: Archives
      pageRef: /archives
      weight: 20
    - identifier: categories
      name: Categories
      pageRef: /categories
      weight: 30
    - identifier: tags
      name: Tags
      pageRef: /tags
      weight: 40

params:
  author:
    name: Hiroshi Shimoju
  description: テクノロジーと社会
  dateFormat: 2006/01/02
  showRSS: true
  shareServices:
    - x
    - facebook
    - bluesky
    - hatena
  hatenaStar:
    enabled: true
    author: Shimoju
  socialLinks:
    - name: x
      url: https://x.com/shimoju_
    - name: bluesky
      url: https://bsky.app/profile/shimoju.jp
    - name: github
      url: https://github.com/shimoju
