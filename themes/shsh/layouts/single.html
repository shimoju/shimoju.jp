{{ define "main" }}
  <article>
    <header class="article-header">
      <h1>{{ .Title }}</h1>
      {{ partial "dates.html" . }}
      {{ partial "media/cover.html" (dict "page" . "class" "article-cover" "loading" "eager") }}
    </header>
    <div class="prose">{{ .Content }}</div>
  </article>
{{ end }}
